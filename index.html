<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>BTC Spot Price Capture</title>
</head>
<body>
  <h2>Live BTC Spot Price (IST)</h2>
  <p>Current IST Time: <span id="istTime">--</span></p>
  <p>Current Spot Price: <span id="livePrice">--</span></p>

  <h3>Captured Values (Today)</h3>
  <ul>
    <li>Close @ 09:00 IST: <span id="close0900">Not captured</span></li>
    <li>Close @ 13:30 IST: <span id="close1330">Not captured</span></li>
    <li>Open @ 14:00 IST: <span id="open1400">Not captured</span></li>
    <li>Close @ 17:00 IST: <span id="close1700">Not captured</span></li>
  </ul>

  <script>
    const TICKER_URL = "https://api.india.delta.exchange/v2/tickers/BTCUSD";

    // Target capture times in IST (24-hour format)
    const TARGETS = [
      { key: "close0900", hh: 9,  mm: 0,  ss: 0 },
      { key: "close1330", hh: 13, mm: 30, ss: 0 },
      { key: "open1400",  hh: 14, mm: 0,  ss: 0 },
      { key: "close1700", hh: 17, mm: 0,  ss: 0 }
    ];

    // Stores captured prices and flags to avoid duplicate capture same day
    let capturedValues = {};
    let capturedFlags = {};
    let lastResetDateStr = null;

    function getISTParts() {
      // Get current time broken into IST components using Intl API
      const now = new Date();
      const formatter = new Intl.DateTimeFormat("en-GB", {
        timeZone: "Asia/Kolkata",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
      });
      const parts = formatter.formatToParts(now);
      const map = {};
      parts.forEach(p => { if (p.type !== "literal") map[p.type] = p.value; });
      return {
        dateStr: `${map.year}-${map.month}-${map.day}`,
        hh: parseInt(map.hour, 10),
        mm: parseInt(map.minute, 10),
        ss: parseInt(map.second, 10)
      };
    }

    function resetIfNewDay(dateStr) {
      if (lastResetDateStr !== dateStr) {
        lastResetDateStr = dateStr;
        capturedValues = {};
        capturedFlags = {};
        TARGETS.forEach(t => {
          capturedFlags[t.key] = false;
          document.getElementById(t.key).textContent = "Not captured";
        });
        console.log("New IST day detected. Capture flags reset for:", dateStr);
      }
    }

    async function fetchSpotPrice() {
      try {
        const response = await fetch(TICKER_URL);
        if (!response.ok) {
          throw new Error(`HTTP error: ${response.status}`);
        }
        const data = await response.json();
        if (!data.success || !data.result || !data.result.spot_price) {
          throw new Error("Unexpected response structure");
        }
        return parseFloat(data.result.spot_price);
      } catch (err) {
        console.error("Error fetching spot price:", err);
        return null;
      }
    }

    function checkAndCapture(istParts, price) {
      TARGETS.forEach(t => {
        if (
          !capturedFlags[t.key] &&
          istParts.hh === t.hh &&
          istParts.mm === t.mm &&
          istParts.ss === t.ss
        ) {
          capturedValues[t.key] = price;
          capturedFlags[t.key] = true;
          document.getElementById(t.key).textContent = price;
          console.log(`Captured ${t.key} = ${price} at ${istParts.dateStr} ${t.hh}:${t.mm}:${t.ss} IST`);
        }
      });
    }

    async function pollTick() {
      const istParts = getISTParts();
      resetIfNewDay(istParts.dateStr);

      document.getElementById("istTime").textContent =
        `${istParts.dateStr} ${String(istParts.hh).padStart(2,'0')}:${String(istParts.mm).padStart(2,'0')}:${String(istParts.ss).padStart(2,'0')}`;

      const price = await fetchSpotPrice();
      if (price !== null) {
        document.getElementById("livePrice").textContent = price;
        checkAndCapture(istParts, price);
      }
    }

    function scheduleAlignedPolling() {
      const now = new Date();
      const msIntoSecondCycle = now.getTime() % 5000;
      const delayToNextBoundary = 5000 - msIntoSecondCycle;

      // Wait until next 5-second wall-clock boundary, then poll every 5s
      setTimeout(() => {
        pollTick();
        setInterval(pollTick, 5000);
      }, delayToNextBoundary);
    }

    // Initial immediate poll, then start aligned interval
    pollTick();
    scheduleAlignedPolling();
  </script>
</body>
</html>
