<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Monitor</title>
<style>
  body { font-family: Arial, sans-serif; background: #0d1117; color: #e6edf3; padding: 20px; }
  h2 { color: #58a6ff; }
  table { border-collapse: collapse; width: 100%; margin-top: 15px; }
  th, td { border: 1px solid #30363d; padding: 12px; text-align: center; }
  th { background: #161b22; }
  tr:nth-child(even) { background: #161b22; }
  #status { margin-top: 10px; font-size: 13px; color: #8b949e; }
  #error { color: #f85149; font-weight: bold; }
  #expiryInfo { margin-top: 5px; font-size: 14px; color: #d29922; }
  #spotInfo { font-size: 15px; }
  #alertBanner {
    display: none;
    margin-top: 15px;
    padding: 15px;
    background: #da3633;
    color: #ffffff;
    font-weight: bold;
    font-size: 16px;
    border-radius: 6px;
    animation: flash 1s infinite;
  }
  @keyframes flash {
    0% { opacity: 1; }
    50% { opacity: 0.4; }
    100% { opacity: 1; }
  }
</style>
</head>
<body>

<h2>BTC Option Premium Monitor</h2>

<div id="error"></div>
<div id="spotInfo"></div>
<div id="expiryInfo"></div>
<div id="alertBanner"></div>

<table id="optionTable">
  <thead id="tableHead"></thead>
  <tbody id="tableBody"></tbody>
</table>

<div id="status">Waiting for first update...</div>

<script>
const BASE_URL = "https://api.india.delta.exchange/v2/tickers";
const UNDERLYING = "BTC";
const STRIKE_GAP_1 = 400;
const STRIKE_GAP_2 = 600;
const REFRESH_INTERVAL_MS = 5000;

const ATM_MIN = 100;
const ATM_MAX = 150;
const OTM_PCT_MAX = 50;

let latestData = null;
let alertActive = false;

function parseExpiryFromSymbol(symbol) {
  const parts = symbol.split('-');
  const dateStr = parts[parts.length - 1];
  if (dateStr.length !== 6) return null;

  const dd = parseInt(dateStr.substring(0, 2), 10);
  const mm = parseInt(dateStr.substring(2, 4), 10) - 1;
  const yy = parseInt(dateStr.substring(4, 6), 10) + 2000;

  return new Date(yy, mm, dd);
}

function findClosestStrike(strikes, spot) {
  let closest = null;
  let minDiff = Infinity;

  strikes.forEach(s => {
    const diff = Math.abs(s - spot);
    if (diff < minDiff) {
      minDiff = diff;
      closest = s;
    }
  });

  return closest;
}

function playBeep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();

    const oscillator = ctx.createOscillator();
    const gainNode = ctx.createGain();

    oscillator.connect(gainNode);
    gainNode.connect(ctx.destination);

    oscillator.type = 'sine';
    oscillator.frequency.value = 880;
    gainNode.gain.value = 0.3;

    oscillator.start();

    setTimeout(() => {
      oscillator.stop();
      ctx.close();
    }, 400);

  } catch (e) {
    console.warn('Audio playback failed:', e);
  }
}

function renderTable(context) {
  const {
    strikeMap,
    atmStrike,
    spotPrice,
    expiryDisplayStr,
    isZeroDTE
  } = context;

  document.getElementById('spotInfo').textContent =
    `Spot Price: ${Math.round(spotPrice)} | ATM Strike: ${atmStrike}`;

  document.getElementById('expiryInfo').textContent =
    isZeroDTE
      ? `Showing 0DTE expiry: ${expiryDisplayStr}`
      : `No 0DTE expiry today. Showing nearest available expiry: ${expiryDisplayStr}`;

  const atmEntry = strikeMap[atmStrike] ? strikeMap[atmStrike].put : null;
  const otmStrike1 = atmStrike - STRIKE_GAP_1;
  const otmStrike2 = atmStrike - STRIKE_GAP_2;

  const otmEntry1 = strikeMap[otmStrike1] ? strikeMap[otmStrike1].put : null;
  const otmEntry2 = strikeMap[otmStrike2] ? strikeMap[otmStrike2].put : null;

  const atmMark = atmEntry ? parseFloat(atmEntry.mark_price) : null;
  const otmMark1 = otmEntry1 ? parseFloat(otmEntry1.mark_price) : null;
  const otmMark2 = otmEntry2 ? parseFloat(otmEntry2.mark_price) : null;

  const otmPctNumeric1 =
    (otmMark1 !== null && otmMark2 !== null) ? (otmMark2 / otmMark1) * 100 : null;

  const otmPctNumeric2 =
    (otmMark2 !== null && otmMark1 !== null) ? (otmMark2 / otmMark1) * 100 : null;

  document.getElementById('tableHead').innerHTML = `
    <tr>
      <th>Strike Type</th>
      <th>Strike Price</th>
      <th>Put Mark Price</th>
      <th>Put LTP</th>
      <th>% Premium vs ATM-400</th>
    </tr>
  `;

  const rows = [
    {
      label: 'ATM - 400',
      strike: otmStrike1,
      entry: otmEntry1,
      pct: '100%'
    },
    {
      label: 'ATM - 600',
      strike: otmStrike2,
      entry: otmEntry2,
      pct: otmPctNumeric2 !== null ? Math.round(otmPctNumeric2) + '%' : 'N/A'
    }
  ];

  let html = '';

  rows.forEach((row, index) => {
    const mark = row.entry ? Math.round(parseFloat(row.entry.mark_price)) : 'N/A';
    const ltp = row.entry ? Math.round(parseFloat(row.entry.close)) : 'N/A';
    const pct = index === 0 ? '100%' : row.pct;

    html += `
      <tr>
        <td>${row.label}</td>
        <td>${row.strike}</td>
        <td>${mark}</td>
        <td>${ltp}</td>
        <td>${pct}</td>
      </tr>
    `;
  });

  document.getElementById('tableBody').innerHTML = html;
  document.getElementById('status').textContent =
    `Last updated: ${new Date().toLocaleTimeString()}`;

  const conditionMet =
    atmMark !== null &&
    atmMark > ATM_MIN &&
    atmMark < ATM_MAX &&
    otmPctNumeric2 !== null &&
    otmPctNumeric2 < OTM_PCT_MAX;

  const banner = document.getElementById('alertBanner');

  if (conditionMet) {
    banner.style.display = 'block';
    banner.textContent =
      `ALERT: ATM Put Mark Price (${Math.round(atmMark)}) is between ${ATM_MIN}-${ATM_MAX}, ` +
      `and ATM-600 Put premium is ${Math.round(otmPctNumeric2)}% of ATM-400 (below ${OTM_PCT_MAX}%).`;

    if (!alertActive) {
      playBeep();
      alertActive = true;
    }
  } else {
    banner.style.display = 'none';
    alertActive = false;
  }
}

async function fetchOptionChain() {
  const url = `${BASE_URL}?contract_types=put_options&underlying_asset_symbols=${UNDERLYING}`;

  try {
    const response = await fetch(url);

    if (!response.ok) {
      throw new Error(`HTTP error: ${response.status}`);
    }

    const data = await response.json();

    if (!data.success || !data.result || data.result.length === 0) {
      document.getElementById('error').textContent = 'No live BTC option data found.';
      document.getElementById('tableBody').innerHTML = '';
      document.getElementById('tableHead').innerHTML = '';
      document.getElementById('spotInfo').textContent = '';
      document.getElementById('expiryInfo').textContent = '';
      return;
    }

    document.getElementById('error').textContent = '';

    const tickers = data.result;
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const expiryGroups = {};

    tickers.forEach(t => {
      const expiryDate = parseExpiryFromSymbol(t.symbol);
      if (!expiryDate) return;

      const key = expiryDate.getTime();
      if (!expiryGroups[key]) {
        expiryGroups[key] = [];
      }
      expiryGroups[key].push(t);
    });

    const expiryKeys = Object.keys(expiryGroups)
      .map(Number)
      .sort((a, b) => a - b);

    let chosenExpiryKey = null;
    for (const key of expiryKeys) {
      if (key >= today.getTime()) {
        chosenExpiryKey = key;
        break;
      }
    }

    if (chosenExpiryKey === null && expiryKeys.length > 0) {
      chosenExpiryKey = expiryKeys[expiryKeys.length - 1];
    }

    if (chosenExpiryKey === null) {
      document.getElementById('error').textContent = 'Could not determine any valid expiry.';
      return;
    }

    const chosenExpiryDate = new Date(chosenExpiryKey);
    const isZeroDTE = chosenExpiryDate.getTime() === today.getTime();
    const expiryDisplayStr = chosenExpiryDate.toLocaleDateString('en-GB');
    const relevantTickers = expiryGroups[chosenExpiryKey];
    const spotPrice = parseFloat(relevantTickers[0].spot_price);

    const strikeMap = {};
    const strikeSet = new Set();

    relevantTickers.forEach(t => {
      const strike = parseFloat(t.strike_price);
      strikeSet.add(strike);

      if (!strikeMap[strike]) {
        strikeMap[strike] = {};
      }

      if (t.contract_type === 'put_options') {
        strikeMap[strike].put = t;
      }
    });

    const strikesArray = Array.from(strikeSet);
    const atmStrike = findClosestStrike(strikesArray, spotPrice);

    latestData = {
      strikeMap,
      atmStrike,
      spotPrice,
      expiryDisplayStr,
      isZeroDTE
    };

    renderTable(latestData);

  } catch (err) {
    document.getElementById('error').textContent = `Error fetching data: ${err.message}`;
  }
}

fetchOptionChain();
setInterval(fetchOptionChain, REFRESH_INTERVAL_MS);
</script>

</body>
</html>
